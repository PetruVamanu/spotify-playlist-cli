[package]
name = "spotify-playlist-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
rspotify = { version = "0.16", features = ["client-reqwest", "env-file"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
nucleo-matcher = "0.3"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
open = "5"
tiny_http = "0.12"
futures = "0.3"
unicode-width = "0.2"
